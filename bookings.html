<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=Fresh Whiteboy, initial-scale=1.0" />
    <title>Barber Shop | Stay Fresh with Whiteboy</title>
    <link rel="icon" type="image/x-icon" href="./icons/favicon.ico" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <style>
      /* =================  RESERVATION SECTION ================= */
      .reservation{
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 7.2rem;
        padding: 5rem;

      }

        .section-label {
        text-transform: uppercase;
        color: var(--blue-theme);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .section-label::before,
      .section-label::after {
        content: "";
        display: inline-block;
        width: 25px;
        height: 2px;
        background: var(--blue-theme);
        vertical-align: middle;
        margin: 0 13px;
      }
      .reservation > h2 {
        text-transform: uppercase;
        font-size: 32px;
        margin: 10px 0 8px;
        color: var(--blue);
      }

      .reservation-item{
        padding: 1rem;
        display: flex;
        flex-direction: column;
       align-items: center;

      }  

      .reservation-form{
        padding: 0.5rem;
      }

      .reservation-calendar{
        padding-top: 1rem;
        display: flex;
        flex-direction: column;
       align-items: center;
      }
      .reservation-calendar > p, iframe{ 
    margin-top: 15px;
    font-weight: 600;
    color: var(--gray);
}

.reservation-calendar > iframe{
  height: 450px;
  width: 100%;
  min-width: 300px;
}
.reservation-calendar > h2{
  padding-top:2rem;
  color: var(--blue);
}
  </style>
  </head>
  
  <body>
    <!-- -------------------- TOB BAR -------------------- -->
    <section id="top-bar"></section>

    <!-- -------------------- NAVIGATION -------------------- -->
    <section id="header"></section>

    <!-- -------------------- RESERVATION SECTION -------------------- -->
    <section class="reservation">
      <div class="section-label">"Book today! get priority!"</div>
      <h2>Bookings</h2>
      <div class="reservation-item">
          <div class="reservation-form">
          <!-- Google Calendar Appointment Scheduling begin -->
          <link href="https://calendar.google.com/calendar/scheduling-button-script.css" rel="stylesheet">
          <script src="https://calendar.google.com/calendar/scheduling-button-script.js" async></script>
          <script>
          (function() {
            var target = document.currentScript;
            window.addEventListener('load', function() {
              calendar.schedulingButton.load({
                url: 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ1gEV4CZcy-HWeRkOPK08YCI6H9Ji_BecFfQrSkeDOcxmpwHcEhXlFeUcn9uIKuZlftbY2q0mrH?gv=true',
                color: '#00a0de',
                label: 'Schedule appointment',
                target,
              });
            });
          })();
          </script>
              <!-- end Google Calendar Appointment Scheduling -->
        </div>    
             <!-- Google Calendar -->
             <div class="reservation-calendar">
                 <p>Refresh the page and check the calendar below to see your reservations.</p>
                 <h2>Calendar</h2>
                 <iframe src="https://calendar.google.com/calendar/embed?src=armel.nzawou.developer%40gmail.com&ctz=Africa%2FJohannesburg" style="border: 0"  frameborder="0" scrolling="no"></iframe>
             </div>
    </section>


    <!-- -------------------- FOOTER -------------------- -->
    <section id="footer"></section>

    <script src="./js/topNavFooter.js"></script>
  </body>
</html>
